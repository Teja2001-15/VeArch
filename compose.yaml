---
# Arch ERP — Podman Compose
# Usage:
#   1. cp .env.example .env  (then edit secrets)
#   2. podman compose up --build -d
#   3. Open http://localhost:8080

name: arch_erp

services:
  app:
    build:
      context: .
      dockerfile: Containerfile
    container_name: arch_erp_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongo:
    image: mongo:7
    container_name: arch_erp_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: arch_erp
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo_data:
    driver: local
