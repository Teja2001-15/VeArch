<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}}</title>
  <meta name="description" content="Sign in to Arch ERP — Architecture firm project management">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%233b82f6'/><path d='M8 22L16 8l8 14' stroke='white' stroke-width='2' fill='none'/></svg>">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">🏛</div>
      <div>
        <div class="login-logo-text">Arch ERP</div>
        <div class="text-xs text-muted">Architecture Project Management</div>
      </div>
    </div>

    <h1 style="font-size:1.375rem; margin-bottom:6px;">Welcome back</h1>
    <p class="login-subtitle">Sign in to your workspace</p>

    {{if .Error}}
    <div class="alert alert-error" id="login-error" role="alert">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {{.Error}}
    </div>
    {{end}}

    <form method="POST" action="/login" id="login-form">
      <div class="form-group">
        <label class="form-label" for="user_id">User ID</label>
        <input
          id="user_id"
          name="user_id"
          type="text"
          class="form-control"
          placeholder="e.g. admin"
          autocomplete="username"
          required
          autofocus
        >
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          class="form-control"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" class="btn btn-primary w-full btn-lg mt-4" id="login-submit-btn" style="margin-top:20px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Sign In
      </button>
    </form>

    <div style="margin-top:24px; padding-top:20px; border-top:1px solid var(--border); text-align:center;">
      <p class="text-xs text-muted">Contact your administrator if you need access.</p>
    </div>
  </div>
</div>
</body>
</html>
