{{template "base" .}}

{{define "content"}}
{{$user := .CurrentUser}}
<div class="page-header">
  <div>
    <h1 class="page-title">Change Password</h1>
    <p class="page-subtitle">Update your account password</p>
  </div>
</div>

<div class="card" style="max-width:420px;">
  {{if .Error}}   <div class="alert alert-error" id="change-pass-error">{{.Error}}</div>{{end}}
  {{if .Success}} <div class="alert alert-success" id="change-pass-success">Password changed successfully.</div>{{end}}

  <form method="POST" action="/profile/password" id="change-password-form">
    <div class="form-group">
      <label class="form-label" for="current-password">Current Password</label>
      <input id="current-password" name="current_password" type="password" class="form-control" placeholder="••••••••" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="new-password">New Password</label>
      <input id="new-password" name="new_password" type="password" class="form-control" placeholder="Min 8 characters" required minlength="8">
    </div>
    <div class="form-group">
      <label class="form-label" for="confirm-password">Confirm New Password</label>
      <input id="confirm-password" name="confirm_password" type="password" class="form-control" placeholder="Repeat new password" required minlength="8">
      <span class="form-hint">Changing your password will invalidate all other active sessions.</span>
    </div>
    <button type="submit" class="btn btn-primary w-full" id="change-pass-submit-btn" style="margin-top:8px;">Update Password</button>
  </form>
</div>
{{end}}
